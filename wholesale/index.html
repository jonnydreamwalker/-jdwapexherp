<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale Catalog | JDW Apex Herp Dealer Portal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../assets/style.css">
<script src="catalog.js"></script>
</head>
<body class="bg-zinc-950 text-white">
<div class="trust-bar bg-emerald-950 border-b border-emerald-900 text-center text-[11px] py-2 text-emerald-300/90">Dealer Portal · Exclusive Pricing · Not for public retail</div>
<nav class="bg-black border-b border-emerald-900 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
<div class="flex items-center gap-3 min-w-0">
<a href="index.html"><img src="../assets/images/gallery/Logo.png" alt="Logo" class="h-10"></a>
<div>
<p class="text-emerald-400 font-black tracking-tight text-lg leading-none">WHOLESALE</p>
<p class="text-[10px] text-zinc-500" id="dealer-label">Dealer portal</p>
</div>
</div>
<div class="flex items-center gap-3 text-sm">
<span class="hidden sm:inline text-zinc-500 text-xs" id="dealer-email"></span>
<button type="button" onclick="dealerLogout()" class="text-xs uppercase tracking-wider border border-zinc-700 px-3 py-1.5 rounded-lg hover:border-red-800 hover:text-red-400">Log out</button>
</div>
</div>
</nav>
<header class="py-10 px-6 text-center border-b border-zinc-900">
<h1 class="text-3xl md:text-4xl font-black tracking-tighter">Dealer Catalog</h1>
<p class="text-zinc-500 text-sm mt-2">Same products as the public store — dealer pricing only. One login covers every category.</p>
</header>
<section class="max-w-7xl mx-auto px-4 py-8">
<div class="flex flex-wrap gap-2 justify-center mb-10" id="cat-tabs">
<button type="button" data-cat="" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-600 text-black">All</button>
<button type="button" data-cat="Hardscape" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Hardscape</button>
<button type="button" data-cat="Lighting" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Lighting</button>
<button type="button" data-cat="Substrates" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Substrates</button>
<button type="button" data-cat="Nutrition" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Nutrition</button>
<button type="button" data-cat="Apparel" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Apparel</button>
<button type="button" data-cat="Enclosures" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Enclosures</button>
<button type="button" data-cat="Heating" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Heating</button>
<button type="button" data-cat="Hardware" class="cat-tab px-4 py-2 rounded-xl text-sm font-semibold bg-zinc-900 border border-zinc-800 hover:border-emerald-700">Hardware</button>
</div>
<p id="catalog-status" class="text-center text-zinc-500 text-sm mb-6">Loading dealer pricing…</p>
<div id="dealer-catalog" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>
<footer class="border-t border-zinc-900 py-8 text-center text-xs text-zinc-600">
<a href="../index.html" class="hover:text-emerald-400">Public store</a> · © 2026 JDW Apex Herp Wholesale
</footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  requireDealerAuth().then(function (ok) {
    if (!ok) return;
    var d = JSON.parse(localStorage.getItem("jdw_dealer") || "{}");
    if (d.business_name) document.getElementById("dealer-label").textContent = d.business_name;
    if (d.email) document.getElementById("dealer-email").textContent = d.email;
    loadDealerCatalog("");
    document.querySelectorAll(".cat-tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".cat-tab").forEach(function (b) {
          b.classList.remove("bg-emerald-600", "text-black");
          b.classList.add("bg-zinc-900", "border", "border-zinc-800");
        });
        btn.classList.add("bg-emerald-600", "text-black");
        btn.classList.remove("bg-zinc-900", "border", "border-zinc-800");
        loadDealerCatalog(btn.getAttribute("data-cat") || "");
      });
    });
  });
});
</script>
</body>
</html>
