<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealers · ApexFreePort</title>
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<header class="border-b border-zinc-800 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
<div>
<p class="text-emerald-400 font-black tracking-tight text-xl">ApexFreePort · Dealers</p>
<p class="text-xs text-zinc-500">Approve applications · issue password invites · set dealer prices</p>
</div>
<div class="flex gap-3 text-sm">
<a href="/admin" class="text-zinc-400 hover:text-emerald-400">Inventory</a>
<a href="/admin/fulfillment" class="text-zinc-400 hover:text-emerald-400">Fulfillment</a>
</div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8 space-y-10">
<section>
<h2 class="text-lg font-bold text-emerald-400 mb-4">Pending applications</h2>
<div id="apps" class="space-y-4 text-sm"></div>
</section>
<section>
<h2 class="text-lg font-bold text-emerald-400 mb-4">Active / setup dealers</h2>
<div id="dealers" class="space-y-3 text-sm"></div>
</section>
<section>
<h2 class="text-lg font-bold text-emerald-400 mb-4">Set dealer price by SKU</h2>
<form id="price-form" class="flex flex-wrap gap-3 items-end">
<div>
<label class="block text-xs text-zinc-500 mb-1">SKU</label>
<input name="sku" required class="bg-black border border-zinc-700 rounded-lg px-3 py-2" placeholder="HS-UFO-FLAT-01">
</div>
<div>
<label class="block text-xs text-zinc-500 mb-1">Dealer price (USD)</label>
<input name="dealerPrice" type="number" step="0.01" required class="bg-black border border-zinc-700 rounded-lg px-3 py-2" placeholder="21.24">
</div>
<button class="bg-emerald-600 text-black font-bold px-4 py-2 rounded-lg">Save</button>
<span id="price-msg" class="text-xs text-zinc-500"></span>
</form>
</section>
</main>
<script>
async function api(path, opts) {
  opts = opts || {};
  opts.credentials = "include";
  opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; return null; }
  return r;
}
async function load() {
  const ra = await api("/api/wholesale/applications");
  const rd = await api("/api/wholesale/dealers");
  if (!ra || !rd) return;
  const apps = (await ra.json()).applications || [];
  const dealers = (await rd.json()).dealers || [];
  const box = document.getElementById("apps");
  const pending = apps.filter(function (a) { return a.status === "pending"; });
  if (!pending.length) {
    box.innerHTML = '<p class="text-zinc-600">No pending applications.</p>';
  } else {
    box.innerHTML = pending.map(function (a) {
      return '<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">' +
        '<div class="flex flex-wrap justify-between gap-2"><strong>' + a.business_name + '</strong><span class="text-zinc-500">' + a.id + '</span></div>' +
        '<p class="text-zinc-400 mt-1">' + a.contact_name + ' · ' + a.email + ' · ' + a.phone + '</p>' +
        '<p class="text-zinc-500 mt-1">Tax/EIN: ' + a.tax_id + (a.resale_cert ? ' · Resale: ' + a.resale_cert : '') + '</p>' +
        '<p class="mt-1"><a class="text-emerald-400 underline" href="' + a.website + '" target="_blank" rel="noopener">Website</a>' +
        (a.instagram ? ' · IG: ' + a.instagram : '') +
        (a.social ? ' · ' + a.social : '') + '</p>' +
        '<p class="text-zinc-500 mt-1">' + a.business_type + ' · ' + a.city + ', ' + a.state + ' · interests: ' + (a.interests || []).join(', ') + '</p>' +
        (a.message ? '<p class="text-zinc-600 mt-1">' + a.message + '</p>' : '') +
        '<div class="mt-3 flex gap-2">' +
        '<button data-id="' + a.id + '" data-act="approve" class="decide bg-emerald-600 text-black font-bold px-3 py-1.5 rounded-lg text-xs">APPROVE</button>' +
        '<button data-id="' + a.id + '" data-act="reject" class="decide bg-zinc-800 border border-zinc-600 px-3 py-1.5 rounded-lg text-xs">REJECT</button>' +
        '</div><p class="setup-url text-xs text-amber-400/90 mt-2 hidden"></p></div>';
    }).join("");
    box.querySelectorAll(".decide").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        const id = btn.getAttribute("data-id");
        const decision = btn.getAttribute("data-act");
        const r = await api("/api/wholesale/applications/" + id + "/decide", {
          method: "POST",
          body: JSON.stringify({ decision: decision })
        });
        if (!r) return;
        const j = await r.json();
        if (decision === "approve" && j.setupUrl) {
          const card = btn.closest("div");
          const el = card.querySelector(".setup-url");
          el.classList.remove("hidden");
          el.innerHTML = 'Send setup link: <a class="underline break-all" href="' + j.setupUrl + '">' + j.setupUrl + "</a>";
        } else {
          load();
        }
      });
    });
  }
  document.getElementById("dealers").innerHTML = dealers.length
    ? dealers.map(function (d) {
        return '<div class="bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 flex flex-wrap justify-between gap-2">' +
          "<div><strong>" + d.business_name + "</strong> · " + d.email +
          '<span class="text-zinc-500"> · ' + d.status + (d.hasPassword ? " · password set" : " · awaiting password") + "</span></div></div>";
      }).join("")
    : '<p class="text-zinc-600">No dealers yet.</p>';
}
document.getElementById("price-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await api("/api/wholesale/sku-price", {
    method: "POST",
    body: JSON.stringify({ sku: fd.get("sku"), dealerPrice: Number(fd.get("dealerPrice")) })
  });
  const msg = document.getElementById("price-msg");
  if (!r) return;
  const j = await r.json();
  msg.textContent = r.ok ? ("Saved " + j.sku + " dealer $" + j.dealerPrice) : (j.error || "Failed");
});
load();
</script>
</body>
</html>
